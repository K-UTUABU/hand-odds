name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # ジョブ名 check は、main の保護設定で「通過必須」に指定する名前。変えるときは保護設定も直す
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # build は型チェック（tsc -b）を含む
      - run: npm run build
